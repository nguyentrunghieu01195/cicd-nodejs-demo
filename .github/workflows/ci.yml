name: Node.js CI/CD

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: 1. Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

  test:
    name: 2. Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

  build:
    name: 3. Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

  deliver:
    name: 4. Continuous Delivery
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Prepare release package
        run: |
          mkdir -p release
          cp src/*.js package.json README.md release/
          tar -czf cicd-nodejs-demo-${GITHUB_SHA::7}.tar.gz -C release .

      - name: Upload release artifact
        uses: actions/upload-artifact@v6
        with:
          name: cicd-nodejs-demo-${{ github.sha }}
          path: cicd-nodejs-demo-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy-staging:
    name: 5. Deploy to staging (approval required)
    runs-on: ubuntu-latest
    needs: deliver
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: staging

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v7
        with:
          name: cicd-nodejs-demo-${{ github.sha }}

      - name: Copy package to staging server
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_PATH: ${{ vars.STAGING_PATH }}
        run: |
          test -n "$STAGING_HOST" && test -n "$STAGING_USER" && test -n "$STAGING_SSH_KEY" && test -n "$STAGING_PATH"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$STAGING_HOST" >> ~/.ssh/known_hosts
          scp -i ~/.ssh/deploy_key cicd-nodejs-demo-*.tar.gz "$STAGING_USER@$STAGING_HOST:/tmp/cicd-nodejs-demo.tar.gz"
          ssh -i ~/.ssh/deploy_key "$STAGING_USER@$STAGING_HOST" \
            "mkdir -p '$STAGING_PATH' && tar -xzf /tmp/cicd-nodejs-demo.tar.gz -C '$STAGING_PATH' && rm /tmp/cicd-nodejs-demo.tar.gz"
          rm -f ~/.ssh/deploy_key
